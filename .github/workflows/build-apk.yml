name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [robot]
    paths:
      - 'src/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'build.sh'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$ANDROID_HOME/build-tools/34.0.0" | head -50

      - name: Edge voice check (token + live synthesis)
        run: |
          mkdir -p build-test
          javac -d build-test src/com/robot/arkadas/SecMsGec.java src/com/robot/arkadas/EdgeTts.java tools/EdgeTtsTest.java
          java -cp build-test com.robot.arkadas.EdgeTtsTest

      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          KEYSTORE="$RUNNER_TEMP/release.p12" ./build.sh
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: robot-arkadas-apk
          path: robot-arkadas.apk

      - name: Commit APK to apk/robot-arkadas.apk
        run: |
          mkdir -p apk
          cp robot-arkadas.apk apk/robot-arkadas.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/robot-arkadas.apk
          if git diff --cached --quiet; then echo "APK unchanged"; exit 0; fi
          git commit -m "APK: otomatik derleme (${GITHUB_SHA::7})"
          for i in 1 2 3 4 5; do
            git pull --rebase origin robot && git push origin HEAD:robot && exit 0
            sleep 6
          done
          exit 1
